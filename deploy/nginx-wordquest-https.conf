server {
    listen 443 ssl http2;
    server_name 123.56.18.77;

    ssl_certificate /etc/letsencrypt/live/123.56.18.77/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.56.18.77/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WordQuestSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/wordquest-https-access.log;
    error_log /var/log/nginx/wordquest-https-error.log;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /wordquest {
        return 301 /wordquest/;
    }

    location = /wordquest/health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wordquest/sw.js {
        root /var/www;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /wordquest/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /wordquest/assets/ {
        root /var/www;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /wordquest/ {
        root /var/www;
        try_files $uri $uri/ /wordquest/index.html;
    }

    location /audio/ {
        alias /usr/share/nginx/html/audio/;
    }

    location / {
        proxy_pass http://127.0.0.1:9021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
