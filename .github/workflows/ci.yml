name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wordquest
          POSTGRES_USER: wordquest
          POSTGRES_PASSWORD: wordquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordquest -d wordquest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wordquest:wordquest@localhost:5432/wordquest?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm db:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm vitest run server/database/integration.test.ts
        env:
          RUN_DB_INTEGRATION: 'true'
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
