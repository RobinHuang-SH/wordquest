services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD: wordquest
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wordquest -d wordquest']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - wordquest-postgres:/var/lib/postgresql/data

volumes:
  wordquest-postgres:
